name: Ubuntu 20.04.6 LTS Build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/ubuntu-20.04.6.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/**"
      - "translations/**"
      - "deploy/linux/flatpak/**"

permissions:
  contents: read

concurrency:
  group: ubuntu-20.04.6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Ubuntu 20.04.6 compatible x86_64 Flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Current Deskflow requires Qt 6.7+, libei 1.3+, and libportal 0.9+.
    # Ubuntu 20.04 does not provide that native dependency set, so build the
    # upstream-supported Flatpak package. The resulting bundle is installable
    # on Ubuntu 20.04.6 LTS with Flatpak enabled.
    container:
      # Keep this aligned with Deskflow's proven upstream Flatpak CI image.
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Allow local Git sources
        run: git config --global protocol.file.allow always

      - name: Get version
        uses: ./.github/actions/get-version

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: deskflow-${{ env.DESKFLOW_PACKAGE_VERSION }}-ubuntu-20.04.6-x86_64.flatpak
          manifest-path: deploy/linux/flatpak/org.deskflow.deskflow.yml
          cache-key: flatpak-builder-ubuntu-20.04.6-x86_64-2.0
          arch: x86_64
          upload-artifact: false

      - name: Validate Flatpak build
        run: flatpak-builder-lint --exceptions --user-exceptions deploy/linux/flatpak/ci-build-lint-exceptions.json repo repo

      - name: Upload Ubuntu 20.04.6 artifact
        uses: actions/upload-artifact@v7
        with:
          name: deskflow-ubuntu-20.04.6-x86_64
          path: ${{ github.workspace }}/deskflow-*-ubuntu-20.04.6-x86_64.flatpak
          if-no-files-found: error
          retention-days: 30
